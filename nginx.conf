server {
    listen      80;
    listen  [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers (server-wide) ----------
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # ---------- Gzip ----------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        text/javascript application/javascript
        application/json application/xml
        image/svg+xml;

    # ---------- Health endpoint (plain 200, no logging) ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- Static assets: cache 30 days ----------
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---------- HTML: never cache ----------
    # Applies to "/" and any SPA fallback, so users always get fresh HTML.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Re-declare security headers — add_header resets inheritance inside a location.
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.html;
    }
}