services:
  dashboard:
    build: .
    image: vps-dashboard:latest
    container_name: vps-dashboard
    restart: always

    # Bind to 127.0.0.1 by default — put a reverse proxy in front for public access.
    # To expose directly: change BIND_ADDR to 0.0.0.0 (only if you have TLS).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:80"

    environment:
      - TZ=${TZ:-UTC}

networks:
  default:
    name: vps-dashboard-net