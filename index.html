<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Projects & Services dashboard — a clean control panel for your self-hosted stack." />
  <title>Dashboard - @zixa</title>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#ecfdf5', 400:'#34d399', 500:'#10b981', 600:'#059669' },
            darkBg: '#0b0f17',
            darkCard: '#131b26',
            darkBorder: '#1e293b'
          },
          fontFamily: {
            sans: ['Inter','system-ui','-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','sans-serif'],
            mono: ['JetBrains Mono','ui-monospace','SFMono-Regular','Menlo','Monaco','Consolas','monospace']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen">
  <div class="ambient" aria-hidden="true"></div>

  <div class="shell max-w-[960px] w-full mx-auto px-4 sm:px-6 py-10 space-y-6">

    <header class="topbar flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6">
      <div>
        <h1 class="title text-2xl font-bold tracking-tight text-white">Projects &amp; Services</h1>
        <p class="subtitle mt-1 text-sm text-slate-400">Self-hosted control panel, all in one place.</p>
      </div>

      <div class="flex items-center gap-3">
        <div class="server-pill inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-darkCard border border-slate-800 text-xs font-mono text-slate-300 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400 status-pulse"></span>
          <span class="text-slate-400">Server:</span>
          <span class="text-emerald-400 font-medium">zixa-local-server</span>
        </div>

        <button id="themeToggleBtn" type="button" aria-label="Toggle theme"
                class="theme-btn p-2 rounded-lg bg-darkCard border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition">
          <svg id="sunIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                  stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
          <svg id="moonIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                  stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="services-list" class="services space-y-3"></div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
